---
# maintains ports, bianry or repo urls

org: encapsulate
domain_regex: ^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$
monitor_server_dns: monitor.encapsulate.xyz
ansible_port: 8192

architecture_map:
  x86_64: amd64
  aarch64: arm64

default_node_types:
  - validator
  - default

tmp_dir: /tmp

pharos:
  validator:
    source_url: https://github.com/PharosNetwork/resources/releases/download
    ops_url: https://github.com/PharosNetwork/ops/releases/latest/download
    ports:
      http_port: 18100
      ws_port: 18200
      tcp_port: 19000
      rpc_port: 20000

pushgateway:
  service_identifier: pushgateway
  source_url: https://github.com/prometheus/pushgateway/releases/download
  file_extension: tar.gz
  ports:
    listen_port: 9091
