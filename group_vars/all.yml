---
# maintains ports, bianry or repo urls

org: encapsulate
domain_regex: ^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$
monitor_server_dns: monitor.encapsulate.xyz
pushgateway_dns: pushgateway.encapsulate.xyz
ansible_port: 8192

architecture_map:
  x86_64: amd64
  aarch64: arm64

default_node_types:
  - validator
  - default

tmp_dir: /tmp

pharos:
  validator:
    source_url: https://github.com/PharosNetwork/resources/releases/download
    ports:
      client_tls_port: 18000
      client_http_port: 18100
      client_ws_port: 18200
      client_wss_port: 18300
      domain0_port: 19000
      domain1_port: 19001
      domain2_port: 19002
      rpc_port: 20000
      master_lite_admin_port: 23100
      server_lite_admin_port: 23101
  prune:
    source_url: https://github.com/PharosNetwork/resources/releases/download
