---
# maintains file name, binary names, and anything which is not a directory or path

# key file names
node_bls_key_file_name: bls.key
node_bls_pub_key_file_name: bls.pub

node_prime_key_file_name: prime.key
node_prime_pub_key_file_name: prime.pub

# config file names
node_domain_config_file_name: domain.json
node_mygrid_env_file_name: mygrid.env.json
node_mygrid_conf_file_name: mygrid.conf.json
node_launch_conf_file_name: launch.conf
node_monitor_conf_file_name: monitor.conf
node_cubenet_conf_file_name: cubenet.conf

# binary names
node_binaries:
  pharos_default:
    default_binary_name: pharos_light
    dest_binary_name: "{{ service_identifier }}"
  pharos_evm_lib:
    default_binary_name: libevmone.so
    dest_binary_name: libevmone.so.0.15
  pharos_version:
    default_binary_name: VERSION
    dest_binary_name: VERSION

# Environment file names
node_environment_general_file_name: "{{ service_identifier }}.env"
