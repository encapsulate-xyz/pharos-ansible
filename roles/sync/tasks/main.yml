---
- name: Stop service
  ansible.builtin.systemd:
    name: "{{ service_identifier }}"
    state: stopped

- name: Delete data folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop:
    - { path: "{{ sync_public_data_dir }}" }
    - { path: "{{ sync_local_storage_dir }}" }
  when: clean_data_dirs | default(false) | bool

- name: Download and extract snapshot
  ansible.builtin.unarchive:
    src: "{{ snapshot_url | default(pharos.validator.snapshot_url) }}"
    dest: "{{ sync_data_dir }}"
    remote_src: true
    owner: "{{ service_identifier }}"
    group: "{{ project }}"

- name: Set ownership for data directory
  ansible.builtin.file:
    path: "{{ sync_data_dir }}"
    owner: "{{ service_identifier }}"
    group: "{{ project }}"
    recurse: true

- name: Restart service
  ansible.builtin.systemd:
    name: "{{ service_identifier }}"
    state: restarted
