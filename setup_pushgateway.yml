---
- name: Install Pushgateway
  hosts: all
  become: true
  gather_facts: true
  vars:
    project: "{{ group_names[0] }}"
    system_architecture: "{{ architecture_map[ansible_architecture] | default(ansible_architecture) }}"
  vars_files:
    - group_vars/all.yml
    - group_vars/default.yml
    - group_vars/vault.yml
  tasks:
    - name: Set service_identifier
      ansible.builtin.set_fact:
        service_identifier: "{{ project }}-{{ pushgateway.service_identifier }}"

    - name: Include common handlers
      ansible.builtin.include_role:
        name: common
    - name: Include pushgateway role
      ansible.builtin.include_role:
        name: pushgateway
        public: true

  post_tasks:
    - name: Verify pushgateway
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            log_file_path: "{{ pushgateway_log_file_path }}"
            version_command: "{{ pushgateway_bin_dir }}/{{ service_identifier }} --version"
            expected_version: "{{ pushgateway.version }}"
            health_url: "http://localhost:{{ pushgateway.ports.listen_port }}/-/healthy"
