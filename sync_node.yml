---
- name: Sync node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [validator]
  vars_files:
    - group_vars/all.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment and dependencies
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run sync playbook
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include sync role
          ansible.builtin.include_role:
            name: sync

  post_tasks:
    - name: Verify node
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            health_url: "http://localhost:{{ pharos.validator.ports.http_port }}"
            health_method: POST
            health_body:
              jsonrpc: "2.0"
              method: "eth_blockNumber"
              params: []
              id: 1
